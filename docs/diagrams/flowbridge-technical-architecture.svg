<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">FlowBridge Snowflake Supply Chain Data Platform Architecture</title>
<desc id="desc">Azure Blob Storage JSON files flow through event notifications and Snowflake storage integrations into Snowpipe and Bronze. Snowflake Streams feed Silver validation and dimensional modeling, Gold dynamic tables feed secure serving views, and a Streamlit dashboard consumes governed data. RBAC controls access.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#102b43"/></linearGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#122e45"/><stop offset="1" stop-color="#0c2033"/></linearGradient>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#65e3d2"/></marker>
  <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#b1a7ff"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.4px;fill:#8ba9c2}.title{font-size:36px;font-weight:800;letter-spacing:.4px;fill:#f3f8ff}.subtitle{font-size:17px;fill:#b2c7d9}.panel{fill:url(#snow);stroke:#2e506b;stroke-width:1.6}.source{fill:#142d43;stroke:#5489ad;stroke-width:1.5}.event{fill:#18284a;stroke:#8b85da;stroke-width:1.5}.bronze{fill:#3b2a1d;stroke:#e7a65f;stroke-width:2}.silver{fill:#1d3548;stroke:#9bb8cc;stroke-width:2}.gold{fill:#3d351f;stroke:#e4c55c;stroke-width:2}.serving{fill:#123a3d;stroke:#57c3b6;stroke-width:2}.consumer{fill:#17394b;stroke:#57aecb;stroke-width:1.6}.stage{font-size:12px;font-weight:800;letter-spacing:2px;fill:#8ca9c1}.head{font-size:20px;font-weight:750;fill:#f4f8ff}.body{font-size:14px;fill:#c4d5e3}.muted{font-size:12px;fill:#92abc0}.chip{font-size:11px;font-weight:700;letter-spacing:.7px;fill:#c1d9e8}.arrow{fill:none;stroke:#65e3d2;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.control{fill:none;stroke:#b1a7ff;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#p)}
  </style>
</defs>
<rect width="1600" height="920" rx="24" fill="url(#bg)"/>
<circle cx="1430" cy="80" r="230" fill="#17405e" opacity=".15"/>
<text x="64" y="50" class="eyebrow">DATA PLATFORM / SOLUTION ARCHITECTURE</text>
<text x="64" y="100" class="title">FLOWBRIDGE</text>
<text x="64" y="132" class="subtitle">Azure event-driven ingestion · Snowflake medallion processing · governed supply-chain analytics</text>
<rect x="1280" y="60" width="250" height="42" rx="21" fill="#123d3b" stroke="#318e83"/>
<circle cx="1305" cy="81" r="5" fill="#5ee1d0"/><text x="1321" y="86" font-size="13" font-weight="700" fill="#aaf3e9">OWNER-CONFIRMED RUN</text>
<rect x="56" y="174" width="1488" height="190" rx="18" class="panel"/>
<text x="82" y="204" class="stage">01 / AZURE SOURCE &amp; EVENT NOTIFICATION</text>
<rect x="82" y="224" width="300" height="106" rx="12" class="source"/>
<text x="108" y="258" class="head">Azure Blob Storage</text><text x="108" y="284" class="body">JSON order / supply-chain files</text><text x="108" y="307" class="muted">External landing location</text>
