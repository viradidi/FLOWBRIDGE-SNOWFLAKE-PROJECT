<text x="481" y="258" class="head">Azure Queue / Events</text><text x="481" y="284" class="body">Storage event notifications</text><text x="481" y="307" class="muted">File-arrival signal to Snowflake</text>
<path d="M755 277H818" class="arrow"/>
<rect x="828" y="224" width="300" height="106" rx="12" class="source"/>
<text x="854" y="258" class="head">Snowflake Integrations</text><text x="854" y="284" class="body">Storage + notification integration</text><text x="854" y="307" class="muted">Secure external-stage / event wiring</text>
<path d="M1128 277H1191" class="arrow"/>
<rect x="1201" y="224" width="300" height="106" rx="12" class="source"/>
<text x="1227" y="258" class="head">Snowpipe Auto-ingest</text><text x="1227" y="284" class="body">Notification-driven file loading</text><text x="1227" y="307" class="muted">Automated arrival-to-Bronze path</text>
