<path d="M1348 578H1380" class="arrow"/>
<rect x="1390" y="470" width="126" height="216" rx="14" class="serving"/><text x="1407" y="508" font-size="11" font-weight="800" letter-spacing="1.5" fill="#8ce6d9">SERVING</text><text x="1453" y="543" text-anchor="middle" class="head">Secure</text><text x="1453" y="567" text-anchor="middle" class="head">Views</text><text x="1407" y="607" class="muted">Governed</text><text x="1407" y="625" class="muted">consumer</text><text x="1407" y="643" class="muted">contract</text>
