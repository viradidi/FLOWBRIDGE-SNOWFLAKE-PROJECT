<text x="106" y="508" font-size="12" font-weight="800" letter-spacing="2" fill="#f5bd7d">LAYER 01</text><text x="106" y="543" class="head">BRONZE</text><text x="106" y="576" class="body">Raw file landing</text><text x="106" y="601" class="body">Parsed source payloads</text><text x="106" y="626" class="body">Snowpipe load target</text><rect x="106" y="649" width="142" height="20" rx="9" fill="#614323"/><text x="177" y="663" text-anchor="middle" class="chip">RAW / TRACEABLE</text>
