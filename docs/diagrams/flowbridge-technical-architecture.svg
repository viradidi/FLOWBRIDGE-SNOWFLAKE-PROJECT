<rect x="356" y="470" width="190" height="216" rx="14" class="event"/><text x="380" y="508" font-size="12" font-weight="800" letter-spacing="2" fill="#b5aaff">CHANGE CAPTURE</text><text x="380" y="543" class="head">Streams</text><text x="380" y="576" class="body">Track new Bronze rows</text><text x="380" y="601" class="body">Drive incremental tasks</text><text x="380" y="626" class="muted">Change metadata</text><rect x="380" y="649" width="115" height="20" rx="9" fill="#302e60"/><text x="437" y="663" text-anchor="middle" class="chip">INCREMENTAL</text>
<path d="M546 578H580" class="arrow"/>
<rect x="590" y="470" width="250" height="216" rx="14" class="silver"/><rect x="590" y="470" width="250" height="7" rx="3" fill="#9bb8cc"/><text x="614" y="508" font-size="12" font-weight="800" letter-spacing="2" fill="#b9d3e3">LAYER 02A</text><text x="614" y="543" class="head">SILVER · STAGE 1</text><text x="614" y="576" class="body">Normalize and validate</text><text x="614" y="601" class="body">Required-field / type checks</text><text x="614" y="626" class="body">Rejected rows → dead letter</text><rect x="614" y="649" width="158" height="20" rx="9" fill="#334f63"/><text x="693" y="663" text-anchor="middle" class="chip">QUALITY / DLQ</text>
