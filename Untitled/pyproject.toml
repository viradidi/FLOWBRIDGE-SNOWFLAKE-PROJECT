# Streamlit in Snowflake apps run with a pre-installed version of the Streamlit library.
# To use a different Streamlit version or packages not pre-installed,
# configure a package source available in this deployment, such as an
# artifact repository or an External Access Integration to an approved repository.
# Artifact repositories: (https://docs.snowflake.com/en/developer-guide/streamlit/app-development/dependency-management#snowflake-artifact-repository)
# External Access Integrations: (https://docs.snowflake.com/en/developer-guide/streamlit/additional-features#external-network-access-in-sis)
# If a package repository server is not reachable and the pyproject.toml file has not been modified, the app will fall back to the default version of the Streamlit library.

[project]
name = "streamlit-app"
requires-python = "~=3.11.0"
version = "0.0.1"
description = ""
dependencies = [
    "streamlit[snowflake]"
]

[tool.uv]
constraint-dependencies = ["numba>=0.56.0"]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
streamlit = false
